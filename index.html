<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Database Project</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
  .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
  input, button { display: block; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .row input { width: auto; margin-bottom: 0; }
  .row button { width: auto; margin-bottom: 0; }
  .meta { color: #555; font-size: 0.9em; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.85em; color: #fff; }
  .Present { background: #2e7d32; }
  .Absent { background: #c62828; }
  .None { background: #888; }
  .actions { display: flex; gap: 10px; margin-top: 10px; }
  .actions button { margin-bottom: 0; cursor: pointer; }
  #message { color: #c62828; margin-bottom: 10px; }
</style>
</head>
<body>

<h2>Add New Student</h2>
<form id="dataForm">
  <input type="text" id="studentName" placeholder="Student Name" required>
  <input type="text" id="subjectName" placeholder="Subject Name" required>
  <input type="text" id="section" placeholder="Section" required>
  <button type="submit">Submit to Database</button>
</form>

<h2>Database Records</h2>
<div class="row">
  <label for="date">Date:</label>
  <input type="date" id="date">
  <button type="button" id="refreshBtn">Refresh</button>
</div>
<div id="message"></div>
<div id="recordsContainer">Loading...</div>

<script>
// IMPORTANT: Replace this URL with your specific Vercel deployment URL
const VERCEL_API_URL = 'https://student-api-backend-theta.vercel.app/api';

const dateInput = document.getElementById('date');
const container = document.getElementById('recordsContainer');
const message = document.getElementById('message');
let records = [];

// Default the date picker to today (local date)
const now = new Date();
dateInput.value = now.getFullYear() + '-' +
  String(now.getMonth() + 1).padStart(2, '0') + '-' +
  String(now.getDate()).padStart(2, '0');

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text == null ? '' : String(text);
  return div.innerHTML;
}

function entryFor(record, day) {
  return (record.dates || []).find(d => d.date.slice(0, 10) === day);
}

// Draw the records on the page
function render() {
  const day = dateInput.value;
  container.innerHTML = '';

  if (records.length === 0) {
    container.innerHTML = '<p>No records found.</p>';
    return;
  }

  records.forEach(record => {
    const entry = entryFor(record, day);
    const status = entry ? entry.status : 'None';
    const marked = entry && entry.markedAt
      ? '<br><span class="meta">Marked ' + escapeHtml(new Date(entry.markedAt).toLocaleString()) + '</span>'
      : '';
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <strong>${escapeHtml(record.studentName)}</strong><br>
      <span class="meta">${escapeHtml(record.subjectName)} &middot; ${escapeHtml(record.section)}</span><br>
      <span class="badge ${status}">${status === 'None' ? 'Not marked' : status}</span>${marked}
      <div class="actions">
        <button data-id="${record._id}" data-status="Present">Present</button>
        <button data-id="${record._id}" data-status="Absent">Absent</button>
      </div>`;
    container.appendChild(div);
  });
}

// Function to fetch and display records
async function loadRecords() {
  try {
    const response = await fetch(VERCEL_API_URL, { cache: 'no-store' });
    if (!response.ok) throw new Error('Request failed');
    records = await response.json();
    message.textContent = '';
    render();
  } catch (error) {
    if (records.length === 0) container.innerText = 'Error loading records.';
    else message.textContent = 'Could not refresh. Showing last loaded data.';
  }
}

// Mark a student Present or Absent for the selected date
async function mark(id, status) {
  try {
    const response = await fetch(VERCEL_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, status, date: dateInput.value })
    });
    const data = await response.json();
    if (!response.ok) {
      message.textContent = data.error || 'Failed to save attendance.';
      return;
    }
    message.textContent = '';
    records = records.map(r => (r._id === data._id ? data : r));
    render();
  } catch (error) {
    message.textContent = 'Failed to save attendance.';
  }
}

// Function to handle form submission
document.getElementById('dataForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const studentName = document.getElementById('studentName').value;
  const subjectName = document.getElementById('subjectName').value;
  const section = document.getElementById('section').value;

  try {
    await fetch(VERCEL_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ studentName, subjectName, section })
    });
    // Clear form and reload records
    document.getElementById('dataForm').reset();
    loadRecords();
  } catch (error) {
    alert('Failed to submit record.');
  }
});

container.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-id]');
  if (btn) mark(btn.dataset.id, btn.dataset.status);
});

dateInput.addEventListener('change', render);
document.getElementById('refreshBtn').addEventListener('click', loadRecords);
window.addEventListener('focus', loadRecords);

// Initial load
loadRecords();
</script>

</body>
</html>
